[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-hub-backend"
version = "0.1.0"
description = "invoice-hub 确定性核心（FastAPI，零大模型依赖 · ADR-0001/0002）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "SQLAlchemy>=2.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pytest-cov>=5",
]

[tool.setuptools]
packages = ["app", "app.domain", "app.services", "app.api", "app.workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
