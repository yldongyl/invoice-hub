[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-hub-backend"
version = "0.4.4"           # 与 app.main.APP_VERSION 同步（M3 受理与写路径 WP3.1-3.6）
description = "invoice-hub 确定性核心（FastAPI，零大模型依赖 · ADR-0001/0002）"
requires-python = ">=3.11"  # P07 1.1 声明；本仓在 Python 3.14 实测（M1 门禁报告环境行）
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "SQLAlchemy>=2.0",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",      # M3 FN-1-03 门户上传/recognize multipart 表单解析（Starlette 运行期必需）
    "gmssl>=3.2",                   # M3 FN-5-01 SM2 国密真实算法（纯 Python，无 FFI；证书链为演示模拟）
]

[project.optional-dependencies]
# P07 1.1 可选分组：[agent] 为 M5 LangGraph 域占位——不装也能启动核心（ADR-0001 双轨制；
# 真实依赖 M5 加入且仅安装于 agent/ 环境，禁止进入 backend 运行时——依赖纪律①）
agent = []
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pytest-cov>=5",
    "PyYAML>=6.0",                    # tools/validate_contracts.py
    "referencing>=0.5",               # $ref 解析（validate/tests conftest）
    "openapi-spec-validator>=0.7",    # 全量 openapi lint（缺失走结构化 lint 兜底）
    "openpyxl>=3.1",                  # tools/check_enums.py / check_seeds_vs_ui.py
]

[tool.setuptools]
packages = ["app", "app.domain", "app.services", "app.api", "app.workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "scenario: E2E 场景断言（make test-e2e 即 pytest -m scenario；实施规划 §7 最小场景集）",
    "redline: 红线回归集 R-01~R-06（P08 §1.4；make test-redline=pytest -m redline，每里程碑门禁必跑）",
]
